<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administration - Lina Layan Car</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#b4a070', secondary: '#1f2022' }
                }
            }
        }
    </script>
    <link rel="icon" type="image/png" href="img/logo.png">
</head>
<body class="bg-secondary text-gray-200 font-sans min-h-screen">

    <!-- LOGIN SCREEN -->
    <div id="login-screen" class="flex items-center justify-center min-h-screen">
        <div class="bg-black/40 p-8 rounded-xl border border-gray-800 w-full max-w-md">
            <div class="text-center mb-6">
                <h1 class="text-3xl font-bold text-white mb-2">Espace Admin</h1>
                <p class="text-gray-400">Veuillez vous connecter</p>
            </div>
            <form id="login-form">
                <div class="mb-4">
                    <label class="block text-sm mb-2 text-gray-300">Email</label>
                    <input type="email" id="login-email" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-primary" required>
                </div>
                <div class="mb-6">
                    <label class="block text-sm mb-2 text-gray-300">Mot de passe</label>
                    <input type="password" id="login-password" class="w-full bg-gray-900 border border-gray-700 rounded-lg p-3 text-white focus:outline-none focus:border-primary" required>
                </div>
                <p id="login-error" class="text-red-500 text-sm mb-4 hidden"></p>
                <button type="submit" class="w-full bg-primary hover:bg-yellow-600 text-white font-bold py-3 rounded-lg transition">Connexion</button>
            </form>
        </div>
    </div>

    <!-- DASHBOARD SCREEN (Hidden by default) -->
    <div id="dashboard-screen" class="hidden min-h-screen flex flex-col">
        <!-- Navbar -->
        <nav class="bg-black border-b border-gray-800 p-4">
            <div class="container mx-auto flex justify-between items-center">
                <div class="text-xl font-bold text-primary">Lina Admin</div>
                <div class="flex gap-4 items-center">
                    <button id="tab-vehicules" class="text-white font-bold border-b-2 border-primary">Véhicules</button>
                    <button id="tab-reservations" class="text-gray-400 hover:text-white">Réservations</button>
                    <button id="btn-logout" class="ml-4 bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg text-sm text-white font-bold transition">Déconnexion</button>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="flex-grow container mx-auto p-4 md:p-8">
            
            <!-- SECTION VEHICULES -->
            <section id="section-vehicules">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-white">Gestion des Véhicules</h2>
                    <button id="btn-add-car" class="bg-primary hover:bg-yellow-600 px-4 py-2 rounded-lg text-white font-bold transition">+ Ajouter Véhicule</button>
                </div>
                
                <div class="overflow-x-auto bg-black/40 rounded-xl border border-gray-800">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-900 text-gray-400 uppercase">
                            <tr>
                                <th class="px-6 py-4">Image</th>
                                <th class="px-6 py-4">Modèle</th>
                                <th class="px-6 py-4">Prix (J/M)</th>
                                <th class="px-6 py-4">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="table-vehicules" class="divide-y divide-gray-800">
                            <!-- Injected via JS -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- SECTION RESERVATIONS -->
            <section id="section-reservations" class="hidden">
                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-white">Réservations Récentes</h2>
                </div>
                
                <div class="overflow-x-auto bg-black/40 rounded-xl border border-gray-800">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-gray-900 text-gray-400 uppercase">
                            <tr>
                                <th class="px-6 py-4">Client</th>
                                <th class="px-6 py-4">Véhicule</th>
                                <th class="px-6 py-4">Dates</th>
                                <th class="px-6 py-4">Statut</th>
                            </tr>
                        </thead>
                        <tbody id="table-reservations" class="divide-y divide-gray-800">
                            <!-- Injected via JS -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
